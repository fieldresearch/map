<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=https://pogoboekenberg.github.io/map/">
  <link rel="canonical" href="https://pogoboekenberg.github.io/map/">
  <title>PoGo Boekenberg has moved</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background: #08151e;
      color: #e9f4f2;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      text-align: center;
    }

    main {
      padding: 24px;
    }

    a {
      display: inline-block;
      margin-top: 8px;
      padding: 12px 18px;
      border-radius: 10px;
      background: #52e0a4;
      color: #062018;
      font-weight: 800;
      text-decoration: none;
    }
  </style>
  <script>
    const destination = new URL("https://pogoboekenberg.github.io/map/");
    destination.search = window.location.search;
    destination.hash = window.location.hash;
    window.location.replace(destination.href);
  </script>
</head>
<body>
  <main>
    <h1>PoGo Boekenberg has moved</h1>
    <p>Taking you to the new community map.</p>
    <a href="https://pogoboekenberg.github.io/map/">Open the map</a>
  </main>
</body>
</html>
